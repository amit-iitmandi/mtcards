name: Phase 0 checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: npm run test:security
      - run: node --check routes/post.js && node --check middleware/requireLogin.js && node --check middleware/requireAdmin.js
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: CI=true npm test -- --watchAll=false --runInBand
        working-directory: client
      - run: CI=false NODE_OPTIONS=--openssl-legacy-provider npm run build
        working-directory: client
